<!DOCTYPE html>
<html>
<head>
   <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>MUST Online Application Portal - Create Account</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top banner with the university name -->
  <header>
    <h1>MBARARA UNIVERSITY OF SCIENCE AND TECHNOLOGY</h1>
    <p>Online Application Portal</p>
  </header>

  <!-- Create account box -->
  <div class="box">
    <h2>Create Account</h2>
    <p class="small">Provide your details to receive a temporary password</p>

    <form>
      <label for="surname">Surname</label>
      <input type="text" id="surname" placeholder="Surname">

      <label for="othernames">Other Names</label>
      <input type="text" id="othernames" placeholder="Other names">

      <label for="phone">Phone Number</label>
      <select>
        <option>Uganda (+256)</option>
        <option>Kenya (+254)</option>
        <option>Tanzania (+255)</option>
        <option>Rwanda (+250)</option>
      </select>
      <input type="tel" id="phone" placeholder="0770000000">
      <p class="small">Use an active phone number to receive notifications.</p>

      <label for="useremail">Email Address</label>
      <input type="email" id="useremail" placeholder="myemail@gmail.com">
      <p class="small"><a href="https://accounts.google.com/signup">Don't have an email? Click to create</a></p>

      <button type="submit">Create Account</button>
    </form>

    <!-- This link takes you back to the login page -->
    <a class="button-link" href="index.html">Close</a>
  </div>

</body>
</html>
