<!DOCTYPE html>
<html >
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>MUST Online Application Portal - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top banner with the university name -->
  <header>
    <h1>MBARARA UNIVERSITY OF SCIENCE AND TECHNOLOGY</h1>
    <p>Online Application Portal</p>
  </header>

  <!-- Login box -->
  <div class="box">
    <h2>Welcome Back</h2>
    <p class="small">Log in to access your application dashboard</p>

    <form>
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="name@example.com">

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password">

      <button type="submit">Sign In</button>
    </form>

    <p class="center"><a href="#">Forgot your password?</a></p>

    <hr>

    <p class="center">New to the portal?</p>

    <!-- This link takes you to the second page -->
    <a class="button-link" href="register.html">Create Account</a>
    <a class="button-link" href="#">How to Apply</a>
  </div>

</body>
</html>
